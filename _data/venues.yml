# Venues used by `abbr` in _bibliography/papers.bib.
# category:  key from _data/venue_categories.yml (sets the tag color)
# icon:      venue / organizer logo shown inside the tag (path under assets/img/)
# publisher: publisher logo shown before the venue line (path under assets/img/)
# name:      full name, used as the tag tooltip

# --- Security ---
CCS:
  name: ACM Conference on Computer and Communications Security
  category: security
  icon: badges/ACM.png
  publisher: badges/ACM.png

