- name: AI Misuse Measurement
  description: "Developing methods to quantify and detect malicious applications of AI, from deepfakes to automated cyber attacks."
  image: research/ai-misuse-measurement.svg
  anchor: ai-misuse-measurement
  detail: "Understanding and measuring how AI is being misused in the wild, from MCP server poisoning to adversarial exploitation of AI-powered services, and developing methods to quantify such misuse at scale." # longer text shown on /research/
  papers:
    - title: "[Arxiv-2026] MCPSmell: From Docs to Descriptions: Smell-Aware Evaluation of MCP Server Descriptions"
      url: https://arxiv.org/abs/2602.18914

- name: AI Society Security
  description: "Investigating the societal impacts of AI security risks, including misinformation, surveillance, and governance challenges."
  image: research/ai-society-security.svg
  anchor: ai-society-security
  detail: "Studying the safety implications of deploying AI as participants in social networks and human-like environments, including how AI handles moral dilemmas, social norms, and trust dynamics when acting as autonomous social agents." # longer text shown on /research/
  papers:
    - title: "[ICLR-2026] TrustGen: A Platform of Dynamic Benchmarking on the Trustworthiness of Generative Foundation Models"
      url: https://openreview.net/forum?id=Fcf5fLmaeG

- name: AI for Security
  description: "Applying AI techniques to strengthen cybersecurity defenses, including threat detection, vulnerability analysis, and automated response."
  image: research/ai-for-security.svg
